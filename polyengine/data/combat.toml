# Combat constants for the current Steam ruleset.
# Source: Battle of Polytopia wiki, "Combat" page (community-documented formulas).
#
# Damage model (per exchange):
#   attack_force  = attacker.attack  * (attacker.hp / attacker.max_hp)
#   defense_force = defender.defense * (defender.hp / defender.max_hp) * defense_bonus
#   total_force   = attack_force + defense_force
#   attack_result = round_half_up( (attack_force  / total_force) * attacker.attack  * accuracy )
#   defense_result= round_half_up( (defense_force / total_force) * defender.defense * accuracy )
#
# Defender takes `attack_result`. If it survives AND the attack is melee (range == 1)
# AND the defender can retaliate, the attacker takes `defense_result`.

ruleset_version = "current-2026.07"

[constants]
accuracy = 4.5            # the "* 4.5" multiplier in the damage formula
round_mode = "half_up"    # round-half-up (Math.round semantics), not banker's rounding

# Capturing a city/village is its own action, not a side effect of moving onto
# the tile. `capture_requires_fresh_unit` = true means the unit must begin its
# turn standing on the city (i.e. moving on and capturing are two turns), which
# is the behaviour the current game shows. Kept as data so the M3 Steam replay
# fixtures can settle it rather than a hand-entered guess.
capture_requires_fresh_unit = true
capture_ends_unit_turn = true

[defense_bonus]
# Multipliers applied to defense_force based on the tile the defender stands on / its state.
#
# Verbatim from the wiki's damage formula (Defence_Bonus): "defenceBonus is 1
# when there is no defence bonus, 1.5 for the standard forest/mountain/ocean/
# city bonus, 4 for the city wall bonus."
#
# `city` and `city_walls` apply ONLY to a unit that owns the city and has the
# `fortify` skill. A besieging enemy gets nothing, and neither does a Giant.
none = 1.0
city = 1.5                # friendly city, no walls (fortify skill only)
city_walls = 4.0          # friendly city with walls (fortify skill only)
mountain = 1.5            # defending on a mountain (with Climbing)
forest = 1.5              # defending in a forest (with Archery)
water = 1.0               # TODO: 1.5 with Aquatism, once naval lands
