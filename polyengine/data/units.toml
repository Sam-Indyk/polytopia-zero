# Unit definitions — current Steam ruleset (naval "Path of the Ocean" roster +
# Cloak/Dagger from the Diplomacy update). Special-tribe units excluded.
# Source: current-rules knowledge (Jan 2026); numbers pinned by the M1 Steam
# replay fixtures (see PLAN.md). Stats are shared across the base tribes.
#
# Fields:
#   range == 1 -> melee (takes retaliation); range > 1 -> ranged (no retaliation)
#   trainable  -> can be produced directly in a city THIS milestone. Naval units,
#                 Cloak/Dagger, Giant and Juggernaut are `false` because their
#                 mechanics (ports/embark, infiltration, level-up super units)
#                 land in later milestones; their stats live here now so the data
#                 is already current and M4 only wires the mechanics.
#   naval      -> true for water vessels (movement/attack apply on water tiles)
#   skills     -> descriptive metadata; effects are implemented incrementally

