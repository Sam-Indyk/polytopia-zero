# Unit definitions for the current Steam ruleset.
# Stats are shared across tribes; tribes differ by starting tech / terrain (see tribes.toml).
# Source: Battle of Polytopia wiki, "Units" page.
#
# range == 1  -> melee (takes retaliation)
# range >  1  -> ranged (no retaliation taken)
# `trainable` units can be produced in a city; others (e.g. giant) only appear via level-up.
# `requires_tech` gates training ("" = available from game start).

ruleset_version = "current-2026.07"

