# Unit definitions — current Steam ruleset.
#
# VERIFIED against the Polytopia wiki (fandom `api.php`, cached in .wikicache/)
# by `scripts/check_ruleset.py`, which diffs cost / hp / attack / defence /
# movement / range / naval against each page's Infobox Unit. Skill names use the
# wiki's own vocabulary so the two stay comparable.
# Special-tribe units are out of scope.
#
# Fields:
#   range == 1 -> melee (takes retaliation); range > 1 -> ranged (no retaliation)
#   trainable  -> can be produced directly in a city THIS milestone. Naval hulls,
#                 Cloak/Dagger, Giant and Juggernaut are `false` because their
#                 mechanics (ports/embarking, infiltration, level-up rewards)
#                 land in M4; their stats are current so M4 only wires mechanics.
#   naval      -> a water hull. In current rules these are NOT trained: a land
#                 unit entering a Port becomes a Raft, which is then upgraded
#                 (Scout/Rammer/Bomber) for stars. See `hull_hp_varies` below.
#   skills     -> descriptive metadata; effects are implemented incrementally.
#
# NAVAL HP MODEL: the wiki lists naval health as "Varies" because a hull keeps
# the carried unit's HP (a Warrior in a Rammer has the Warrior's 10 HP). The
# `max_hp` values on naval rows are therefore placeholders used only until M4
# implements carriers properly; `hull_hp_varies = true` marks them so the
# reconciliation checker reports rather than fails on them.

