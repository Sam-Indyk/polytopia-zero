# Technology tree — current Steam ruleset (post "Path of the Ocean" naval rework
# and the Diplomacy update). Special-tribe techs are intentionally excluded.
#
# Cost model (current game): cost = tier * num_cities + 4, i.e. at one city a
# T1/T2/T3 tech costs 5/6/7 stars, and each additional city adds tier stars.
# Philosophy's "Literacy" ability then discounts research by 33% (rounded up).
# A tech may set an explicit `cost_override` to pin a non-formula price (the
# mechanism the game uses when it hand-tunes a specific tech's cost); none are
# overridden today because the formula matches the live values.
#
# PROVENANCE / TODO: tiers, prerequisites and unlocks below are encoded from
# current-rules knowledge (Jan 2026). The authoritative fidelity gate is the
# Steam replay-fixture suite (see PLAN.md M1/M3); reconcile any tech that a
# fixture flags. `unlocks` is descriptive metadata for now — only `unlocks_unit`
# and terrain-access gating are consumed by the engine in M1.

ruleset_version = "current-2026.07"

