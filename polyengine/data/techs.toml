# Technology tree — current Steam ruleset.
#
# VERIFIED against the Polytopia wiki (fandom `api.php`, cached in .wikicache/)
# by `scripts/check_ruleset.py`, which diffs every tier and prerequisite below
# against the pages' Infobox Technology data. Regenerate the cache with
# `python scripts/fetch_wiki.py --all` and re-run the checker after any edit.
#
# 25 technologies: 5 tier-one roots, 10 tier-two, 10 tier-three. Special-tribe
# replacements (Polaris' Polarism, Cymanti's Hydrology, ...) are out of scope.
# Whaling and Engineering were removed from the game and are absent.
#
# Cost model (wiki "Technology Costs" table, confirmed row by row):
#     cost = tier * num_cities + 4
# so at 0 cities every tier costs 4, and at 1 city T1/T2/T3 cost 5/6/7.
# Philosophy's Literacy ability then discounts by 33%, rounded up:
#     cost = ceil(cost * 2/3)
# A tech may set `cost_override` to pin a non-formula price; none do today.

ruleset_version = "current-2026.07"

