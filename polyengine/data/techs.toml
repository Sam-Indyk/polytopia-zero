# Technology tree for the current Steam ruleset (base tribes).
# Each tech has a stable bit index (`id`) used in the per-player tech bitmask,
# a prerequisite (`requires` = "" for tier-1 roots), and a `tier` (1/2/3) used
# to price research: cost = tier * num_cities + tech_discount.
# Source: Battle of Polytopia wiki, "Technology" page (base tech tree).

