# The twelve REGULAR tribes. All share one tech tree, units and buildings; they
# differ only in what they start with and in how their land generates.
#
# The four SPECIAL tribes (Aquarion, Elyrion, Polaris, Cymanti) are excluded by
# decision -- they replace parts of the tech tree and add unique units.
#
# Sources, both cached in .wikicache/:
#   Tribes           -- starting technology, starting unit, starting stars
#   Map Generation   -- "Spawn Rate Modifiers by Tribe"
#
# SPAWN MODIFIERS are multipliers on the base rate, not absolute shares, and the
# base rate IS Luxidoor. They apply in a fixed order, because each renormalises
# what follows:
#
#   1. mountain -- rescales forest and field proportionally
#   2. forest   -- rescales field only (mountain is already fixed)
#   3. field    -- whatever remains: 100% - mountain% - forest%
#
# Resource modifiers are separate: they scale the chance of a resource appearing
# ON its terrain, so Xin-xi's 1.5x mountain and 1.5x metal compound.

ruleset_version = "current-2026.07"

[tribe.xin_xi]
id = 0
symbol = "X"
starting_tech = "climbing"
starting_unit = "warrior"
starting_stars = 7
terrain_mult = { mountain = 1.5 }
resource_mult = { metal = 1.5 }

[tribe.imperius]
id = 1
symbol = "I"
starting_tech = "organization"
starting_unit = "warrior"
starting_stars = 5
terrain_mult = {}
resource_mult = { game = 0.5, fruit = 2.0 }

[tribe.bardur]
id = 2
symbol = "B"
starting_tech = "hunting"
starting_unit = "warrior"
starting_stars = 5
terrain_mult = { forest = 0.8 }
resource_mult = { crop = 0.0 }        # Bardur land grows no crop at all

[tribe.oumaji]
id = 3
symbol = "O"
starting_tech = "riding"
starting_unit = "rider"
starting_stars = 6
terrain_mult = { forest = 0.2, mountain = 0.5 }
resource_mult = { game = 0.2 }
# Oumaji's 0.5x water modifier "is found in the source code but is not
# translated into the world generation", so it is deliberately not applied.

[tribe.kickoo]
id = 4
symbol = "K"
starting_tech = "fishing"
starting_unit = "warrior"
starting_stars = 5
