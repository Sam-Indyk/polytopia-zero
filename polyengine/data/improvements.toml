# Harvests and buildings — the population economy.
#
# VERIFIED against the Polytopia wiki "Population" table (cached in .wikicache/,
# see scripts/fetch_wiki.py). Every cost and population yield below is taken
# from that table; `scripts/check_ruleset.py` re-checks them.
#
# Population is the ONLY route to city levels, and city level is what caps how
# many units a city can support (level + 1). That chain is why this file exists:
# without it, star income has nothing to buy and the correct strategy degenerates
# into flooding the map with warriors.
#
# `kind`:
#   harvest  -> consumes the resource on the tile, leaves no building
#   building -> places a permanent improvement on the tile
# `adjacency` -> population scales with the number of friendly adjacent
#                `adjacent_to` improvements instead of a flat `population`.

ruleset_version = "current-2026.07"

# ---------------- Harvests (resource -> population) ----------------
[improvement.harvest_fruit]
id = 0
kind = "harvest"
cost = 2
population = 1
requires_tech = "organization"
resource = "fruit"
terrain = "field"

[improvement.hunt_game]
id = 1
kind = "harvest"
cost = 2
population = 1
requires_tech = "hunting"
resource = "game"
terrain = "forest"

[improvement.fishing]
id = 2
kind = "harvest"
cost = 2
population = 1
requires_tech = "fishing"
resource = "fish"
terrain = "water"

# ---------------- Buildings ----------------
