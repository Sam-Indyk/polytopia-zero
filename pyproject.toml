[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polytopia-zero"
version = "0.0.1"
description = "A superhuman Battle of Polytopia bot: current-rules engine + PPO self-play league."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "numba>=0.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
]

[tool.setuptools.packages.find]
include = ["polyengine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
