[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polytopia-zero"
version = "0.0.1"
description = "A superhuman Battle of Polytopia bot: current-rules engine + PPO self-play league."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "numba>=0.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
]
# Training extras. Install torch from the index matching your GPU, e.g.
#   pip install torch --index-url https://download.pytorch.org/whl/cu128
# (cu128+ is required for Blackwell / compute capability 12.0.)
train = [
    "torch>=2.4",
]

[tool.setuptools.packages.find]
include = ["polyengine*", "polynet*", "polytrain*"]

[tool.setuptools.package-data]
# The viewer's JS/CSS are real files, not Python strings — they have to ship.
polyengine = ["data/*.toml", "viewer/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: spawns worker processes or trains; slower than the rest of the suite",
]

[tool.ruff]
line-length = 100
target-version = "py311"
